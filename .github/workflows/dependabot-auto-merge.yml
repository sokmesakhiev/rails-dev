name: Dependabot Auto-Merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    # Also require Dependabot to be the one triggering the run: once a human
    # pushes to a Dependabot PR, fetch-metadata refuses the unsigned commits,
    # so skip instead of failing — those PRs are merged manually.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Major bumps may break the build; leave those for manual review.
      # GH_ADMIN_TOKEN (a PAT, stored as a *Dependabot* secret) is used instead of
      # GITHUB_TOKEN so the resulting push to main still triggers deploy.yml.
      - name: Enable auto-merge for patch and minor updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
