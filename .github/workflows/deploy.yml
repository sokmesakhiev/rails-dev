name: Deploy rails-dev website

on:
  push:
    branches: [ "main" ]

# Never run two deploys at once (S3 sync + invalidation would interleave);
# a newer push waits for the running deploy instead of cancelling it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{secrets.AWS_REGION}}

      # Vite's assets/ files are content-hashed, so they can be cached forever;
      # everything else (HTML, sitemap, robots.txt) must revalidate so a new
      # deploy shows up. Upload assets first and prune old ones last, so pages
      # still being served never reference a missing file.
      - name: Deploy to S3
        env:
          BUCKET: s3://${{ secrets.S3_BUCKET }}
        run: |
          aws s3 sync dist/assets "$BUCKET/assets" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync dist/ "$BUCKET" --delete --exclude "assets/*" \
            --cache-control "public, max-age=0, must-revalidate"
          aws s3 sync dist/assets "$BUCKET/assets" --delete \
            --cache-control "public, max-age=31536000, immutable"

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation  --distribution-id ${{secrets.CLOUDFRONT_DIST_ID}} --paths "/*"
      
      - name: Notify Telegram — success
        if: success()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "Rails-Dev frontend deployment succeeded"
          MESSAGE=$(printf '✅ Rails-Dev frontend deployed\nRepo: %s\nBranch: %s\nCommit: %s\nRun: %s' \
            "$REPO" "$BRANCH" "${GITHUB_SHA:0:7}" "$RUN_URL")
          curl --fail-with-body --silent --show-error --max-time 10 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=$MESSAGE"

      - name: Notify Telegram — failure
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "Rails-Dev frontend deployment failed"
          MESSAGE=$(printf '❌ Rails-Dev frontend deployment failed\nRepo: %s\nBranch: %s\nCommit: %s\nRun: %s' \
            "$REPO" "$BRANCH" "${GITHUB_SHA:0:7}" "$RUN_URL")
          curl --fail-with-body --silent --show-error --max-time 10 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=$MESSAGE"